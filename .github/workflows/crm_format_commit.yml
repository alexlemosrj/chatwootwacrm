name: One-time CRM Format Commit

on:
  push:
    branches:
      - upgrade/chatwoot-4.18-kanban
    paths:
      - '.github/workflows/crm_format_commit.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/chatwoot-4.18-kanban

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format CRM frontend
        run: >
          pnpm exec prettier --write
          app/javascript/dashboard/api/pipelines.js
          app/javascript/dashboard/api/deals.js
          app/javascript/dashboard/api/crmActivities.js
          app/javascript/dashboard/api/crmEvents.js
          app/javascript/dashboard/store/modules/pipelines.js
          app/javascript/dashboard/routes/dashboard/pipelines/pipelines.routes.js
          app/javascript/dashboard/routes/dashboard/pipelines/pages/PipelinesIndex.vue
          app/javascript/dashboard/routes/dashboard/pipelines/components/DealDetailModal.vue
          app/javascript/dashboard/routes/dashboard/conversation/ContactDeals.vue

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "CRM frontend already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/javascript/dashboard
          git commit -m "style(crm): normalize frontend formatting"
          git push origin HEAD:upgrade/chatwoot-4.18-kanban
