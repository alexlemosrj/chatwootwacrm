# VPS deploy: Chatwoot web + worker only.
# Postgres = Supabase (external). Redis = Redis Cloud (external).
# Copy .env.example → .env and fill SECRET_KEY_BASE, POSTGRES_*, REDIS_*.
#
# Usage on VPS:
#   docker compose -f docker-compose.vps.yaml up -d --build
#   docker compose -f docker-compose.vps.yaml exec rails bundle exec rails db:chatwoot_prepare

services:
  rails:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: chatwootwacrm:latest
    env_file: .env
    volumes:
      - storage_data:/app/storage
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    image: chatwootwacrm:latest
    env_file: .env
    depends_on:
      - rails
    volumes:
      - storage_data:/app/storage
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

volumes:
  storage_data:
